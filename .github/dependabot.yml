version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-deps:
        dependency-type: "development"

  - package-ecosystem: "npm"
    directory: "/examples/basic-form"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:15"
      timezone: "America/New_York"
    target-branch: "main"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      example-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/examples/server"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:25"
      timezone: "America/New_York"
    target-branch: "main"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      example-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/examples/websocket-sync"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:35"
      timezone: "America/New_York"
    target-branch: "main"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      example-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:40"
      timezone: "America/New_York"
    target-branch: "main"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
